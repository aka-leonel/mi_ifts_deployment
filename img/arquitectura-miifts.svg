<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="46" font-size="22" font-weight="bold" fill="#232F3E">Arquitectura miIFTS en AWS</text>

  <!-- Usuario -->
  <circle cx="460" cy="36" r="11" fill="none" stroke="#232F3E" stroke-width="2"/>
  <path d="M438,72 Q438,54 460,54 Q482,54 482,72" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="495" y="52" font-size="15" fill="#232F3E">Usuario</text>
  <text x="495" y="71" font-size="15" fill="#232F3E">(navegador)</text>

  <!-- AWS Cloud / Región -->
  <rect x="40" y="130" width="1120" height="530" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="58" y="154" font-size="16" font-weight="bold" fill="#232F3E">AWS Cloud</text>
  <rect x="60" y="170" width="1080" height="470" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="78" y="194" font-size="16" fill="#147EBA">Región us-east-1</text>

  <!-- Flujos de usuario -->
  <path d="M460,78 V176" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M460,110 H190 V266" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="325" y="102" font-size="14" text-anchor="middle" fill="#232F3E">(1) Carga la PWA (HTTP)</text>
  <text x="472" y="158" font-size="14" fill="#232F3E">(2) Llamadas a la API (HTTP :8000)</text>

  <!-- S3 -->
  <rect x="162" y="268" width="56" height="56" rx="4" fill="#7AA116"/>
  <ellipse cx="190" cy="285" rx="16" ry="5" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M174,285 L178,314 Q190,320 202,314 L206,285" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="190" y="348" font-size="16" font-weight="bold" text-anchor="middle" fill="#232F3E">Amazon S3</text>
  <text x="190" y="368" font-size="14" text-anchor="middle" fill="#232F3E">bucket miifts-frontend-bucket-*</text>
  <text x="190" y="388" font-size="14" text-anchor="middle" fill="#232F3E">Frontend PWA (Vite)</text>
  <text x="190" y="408" font-size="14" text-anchor="middle" fill="#232F3E">Static website hosting (HTTP)</text>

  <!-- VPC -->
  <rect x="360" y="200" width="760" height="420" fill="none" stroke="#3F8624" stroke-width="1.5"/>
  <text x="500" y="226" font-size="16" font-weight="bold" fill="#3F8624">VPC 10.0.0.0/16</text>

  <!-- Internet Gateway -->
  <rect x="438" y="178" width="44" height="44" rx="4" fill="#8C4FFF"/>
  <path d="M448,194 H472 M468,190 L472,194 L468,198" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M472,208 H448 M452,204 L448,208 L452,212" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="430" y="218" font-size="14" text-anchor="end" fill="#232F3E">Internet</text>
  <text x="430" y="234" font-size="14" text-anchor="end" fill="#232F3E">Gateway</text>

  <!-- Subred pública -->
  <rect x="410" y="240" width="680" height="340" fill="#F1F7E9" stroke="#7AA116" stroke-width="1.5"/>
  <text x="1074" y="264" font-size="15" font-weight="bold" text-anchor="end" fill="#3F6B12">Subred pública 10.0.1.0/24 · us-east-1a</text>
  <text x="1074" y="282" font-size="14" text-anchor="end" fill="#3F6B12">Route table: 0.0.0.0/0 → Internet Gateway</text>

  <!-- Security Group -->
  <rect x="490" y="300" width="570" height="240" fill="none" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="502" y="528" font-size="14" fill="#DD344C">Security Group: TCP 80 y 8000 (0.0.0.0/0)</text>

  <!-- EC2 -->
  <rect x="502" y="316" width="56" height="56" rx="4" fill="#ED7100"/>
  <rect x="516" y="330" width="28" height="28" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M523,325 V330 M530,325 V330 M537,325 V330 M523,358 V363 M530,358 V363 M537,358 V363 M511,337 H516 M511,344 H516 M511,351 H516 M544,337 H549 M544,344 H549 M544,351 H549" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="502" y="394" font-size="15" font-weight="bold" fill="#232F3E">EC2 t3.micro</text>
  <text x="502" y="412" font-size="14" fill="#232F3E">Ubuntu 22.04</text>
  <text x="502" y="430" font-size="14" fill="#232F3E">IAM: LabInstanceProfile</text>

  <!-- Docker Compose -->
  <rect x="690" y="314" width="350" height="182" fill="#EAF4FD" stroke="#2496ED" stroke-width="1.5"/>
  <text x="706" y="336" font-size="14" font-weight="bold" fill="#1D63A6">Docker Compose (dentro de la EC2)</text>

  <rect x="706" y="356" width="140" height="120" fill="#ffffff" stroke="#2496ED" stroke-width="1.5"/>
  <text x="776" y="390" font-size="18" font-weight="bold" text-anchor="middle" fill="#232F3E">api</text>
  <text x="776" y="414" font-size="14" text-anchor="middle" fill="#232F3E">FastAPI + Uvicorn</text>
  <text x="776" y="440" font-size="15" font-weight="bold" text-anchor="middle" fill="#232F3E">:8000</text>

  <rect x="890" y="356" width="130" height="120" fill="#ffffff" stroke="#2496ED" stroke-width="1.5"/>
  <text x="955" y="390" font-size="18" font-weight="bold" text-anchor="middle" fill="#232F3E">db</text>
  <text x="955" y="414" font-size="14" text-anchor="middle" fill="#232F3E">PostgreSQL 16</text>

  <path d="M846,416 H890" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="868" y="408" font-size="13" text-anchor="middle" fill="#232F3E">SQL</text>

  <!-- IGW → api -->
  <path d="M460,222 V455 H706" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
</svg>
